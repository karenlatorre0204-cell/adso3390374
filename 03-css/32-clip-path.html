<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-clip-path</title>
    <link rel="stylesheet" href="../src/css/master.css">

   <style>
    section{
        div.clip{
            background: url(imgs/pittsburgh.jpg) no-repeat center/cover;
            border-radius: 14px;
            corner-shape: squircle;
            margin: 0 auto;
            height: 300px;
            transition: all 0.4s ease-in;
            width: 300px;

            &.clip1{
              clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                &:hover{
                    clip-path: polygon(50% 0%, 100% 0, 100% 35%, 100% 61%, 99% 100%, 49% 100%, 0 100%, 0 58%, 0 36%, 0 0);
                }
            }
            &.clip2{
                clip-path: polygon(0 0, 100% 0, 100% 30%, 100% 100%, 70% 100%, 30% 100%, 0 100%, 0% 30%);
                &:hover{
              clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
                  
            }
        }
    }
}
</style>

</head>
<body class="css">

    </a>
        <main>
            <header class="mainmenu ">
            <h1>32-clip-path</h1>
            <h4>Property lets you clip an element to a basic shape.</h4>
            </header>
         
      <section>
            <h4>Ejemplo 01:</h4>
            <div class="clip clip1"></div>
            <h4>Example 02:</h4>
            <div class="clip clip2"></div>
      </section>
      
    </main>
  </body>
</html>
