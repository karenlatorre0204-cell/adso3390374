<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/css/master.css">

    <style>
    img.filter {
        display: block;
        width: 180px;
        height: 300px;
        margin: 0 auto;
        border: none;
        border-radius: 0;
        transition: all 0.6s ease-in;
    }

    
    img.filter:hover {
        filter: none;
    }

    img.filter1 { filter: grayscale(5); }

    img.filter2 { filter: blur(8px); }

    img.filter3 { filter: sepia(5); }

    img.filter4 { filter: brightness(30%); }

    img.filter5 { filter: invert(5); }

</style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
        <main>
            <header class="mainmenu ">
            <h1>31-filters</h1>
            <h4>Defines visual effects (like blur and saturation).</h4>
            </header>
         
      <section>
            <h3>grayscale</h3><img class="filter filter1" src="imgs/Bombon-removebg-preview.png" alt="Bombon"><h3>Blur</h3>
            <img class="filter filter2" src="imgs/Bombon-removebg-preview.png" alt="Bombon"> 

            <h3>sepia</h3>
            <img class="filter filter3" src="imgs/Bombon-removebg-preview.png" alt="Bombon">
            <h3>brightness</h3>

            <img class="filter filter4" src="imgs/Bombon-removebg-preview.png" alt="Bombon">
            <h3>invert</h3>

            <img class="filter filter5" src="imgs/Bombon-removebg-preview.png" alt="Bombon">
      </section>
      
    </main>
  </body>
</html>
